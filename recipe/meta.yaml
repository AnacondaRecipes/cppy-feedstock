{% set name = "cppy" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 55b5307c11874f242ea135396f398cb67a5bbde4fab3e3c3294ea5fce43a6d68

build:
  skip: true  # [py<37]
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
    - setuptools_scm >=3.4.3
    - toml
    - wheel
  run:
    - python

test:
  imports:
    - cppy
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - setuptools        # [py>313]
  commands:
    - pip check || true  # [not win]
    - pip check || 1  # [win]
    - test -f ${SP_DIR}/cppy/include/cppy/cppy.h  # [not win]
    - pytest -v tests

    # the cpp headers are shipped in the wheel; CFEP-27 moved py3.15's site-packages to
    # %PREFIX%\lib\python\site-packages while conda-build 26.7.1 still reports %SP_DIR%
    # as %PREFIX%\Lib\site-packages, hence the separate selector below.
    # TODO: with conda-build >=26.9.0 (conda/conda-build#5563 takes SP_DIR from the
    # python_site_packages_path record) drop the py>=315 line.
    - IF NOT EXIST "%SP_DIR%\cppy\include\cppy\cppy.h" exit 1                           # [win and py<315]
    - IF NOT EXIST "%PREFIX%\lib\python\site-packages\cppy\include\cppy\cppy.h" exit 1  # [win and py>=315]

about:
  home: https://github.com/nucleic/cppy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: C++ headers for C extension development
  description: |
    A small C++ header library which makes it easier to write Python extension
    modules. The primary feature is a PyObject smart pointer which automatically
    handles reference counting and provides convenience methods for performing
    common object operations.
  doc_url: https://cppy.readthedocs.io
  dev_url: https://github.com/nucleic/cppy

extra:
  recipe-maintainers:
    - MatthieuDartiailh
