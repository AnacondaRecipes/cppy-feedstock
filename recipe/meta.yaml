{% set name = "cppy" %}
{% set version = "1.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 55b5307c11874f242ea135396f398cb67a5bbde4fab3e3c3294ea5fce43a6d68

build:
  skip: true  # [py<37]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
    - setuptools_scm >=3.4.3
    - toml
    - wheel
    - setuptools-scm >=3.4.3
  run:
    - python
    - setuptools >=61.2

test:
  imports:
    - cppy
  requires:
    - pip
  commands:
    - pip check || true  # [not win]
    - pip check || 1  # [win]
    - IF NOT EXIST %SP_DIR%\cppy\include\cppy\cppy.h  exit 1  # [win]
    - test -f ${SP_DIR}/cppy/include/cppy/cppy.h  # [not win]

about:
  home: https://github.com/nucleic/cppy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: C++ headers for C extension development
  description: |
    A small C++ header library which makes it easier to write Python extension
    modules. The primary feature is a PyObject smart pointer which automatically
    handles reference counting and provides convenience methods for performing
    common object operations.
  doc_url: https://cppy.readthedocs.io/en/latest/
  dev_url: https://github.com/nucleic/cppy

extra:
  recipe-maintainers:
    - MatthieuDartiailh
